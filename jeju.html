<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeju_Card</title>
    <style> 
    .card{
        padding: 10px;
        width: 400px;
        background-color: aliceblue;
    }
    /* 이미지 영역 */
    .box{
        /* width: 100%; */
        border-radius: 50px;
        overflow: hidden;
    }
    .box img{
        width: 100%;
    }
    .content{
        padding: 10px;
        background-color: azure;
        height: 150px;
        overflow-y: auto;

    }
    </style>

<!-- 헤드 -->

</head>
<body>
    <div class="card"> 
        <!-- 이미지 영역 -->
        <div class="box"> 
        <img src="jeju.png" alt="제주">
        </div>
        <!-- 내용 영역 -->
        <div class="content"> 
            <h2> 제주도 여행 </h2>
            <p class="con-desc">
            제주도는 아름다운 자연과 바다,
            맛있는 음식으로 유명한 여행지입니다.
            한적한 바닷길을 걷거나 맛있는 음식을
            먹으며 여유로운 여행을 즐길 수 있습니다.
            </p>
            흑돼지, 해산물, 감귤 디저트 등 다채로운 제주의 맛을 즐기며 여유로운 시간을 보낼 수 있습니다. 
            일상의 바쁨을 잠시 내려놓고 휴식과 힐링을 얻기에 더없이 좋은 곳입니다.
            <p>

            </p>
        </div>
    </div>
</body>
</html>
