<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Tokyo-Card </title>
    <style>
        .card{
            padding: 10px;
            width: 400px;
            /* box-shadow: 4px 4px 10px gray; */
            box-shadow: rgba(60, 64, 67, 0.16) 0px 2px 6px 0px ;
            /* background-color: aliceblue; */
        }
        /* 이미지 영역 */
    .img-box{
        width: 100%;
        border-radius: 30px 30px 0 0 ;
        overflow: hidden ;
    }
    .img-box img{
        width: 100%;
        display: block;
    }
    .content{
        background-color: aqua ;
        height: 150px;
        overflow-y: auto;
        padding: 10px;
        border-radius: 0 0 20px 20px;
    }

    </style>

<!-- 헤드 -->

</head>
<body>
    <div class="card"> 
         <!-- 이미지 영역 -->
    <div class="img-box"> 
                <img src="Tokyo.png" alt="도쿄">
    </div>
    <!-- 내용 영역 -->
     <div class="content"> 
        <h2> 도쿄 여행</h2>
        <p> 도쿄는 일본의 전통과 현대적인 문화를 동시에 경험할 수 있는 매력적인 여행지입니다. 
        도쿄타워, 시부야, 아사쿠사, 신주쿠 등 다양한 관광명소를 만날 수 있습니다. 
        맛있는 음식과 쇼핑, 아름다운 야경을 즐길 수 있어 많은 사람들이 도쿄를 여행합니다. </p>

<p> 도쿄의 다양한 명소를 방문하면서 일본의 특별한 문화와 분위기를 느껴보세요. 
    맛있는 음식과 재미있는 볼거리로 잊지 못할 여행을 만들어보세요. </p>
     </div>
    </div>
   

</body>
</html>
