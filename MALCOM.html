<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 폰트 어썸 -->
<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" 
integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" 
crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>MALCOM</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 전체 페이지  */
        .one{
            width: 400px;
            padding: 10px ; 
        }
        /* 제품 이미지 */
.object img{
    width: 100%;
    border-radius: 15px;
    display: block;
}
/* 담기 버튼  */
.cart{
    width: 100%;
    padding: 10px ; 
    margin-top: 10px;
    border-radius: 10px;
    border: none;
    border:1px solid #949494;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    background-color: #fff;

}
/* 제목  */
.subject{
    font-size: 28px;
    font-weight: 350;
    margin-top: 10px;
    margin-bottom: 10px;
}
/* 가격 */
.original{
    margin-top: 10px;
    text-decoration: line-through;
    color: gray;
}
.sale{
    color: red;
}
.now{
font-weight: bold;
}
/* 리뷰 버튼 */
.review{
    margin-top: 10px;
    color: gray;
}
    </style>

</head>
<body>
<div class="one"> 
    <!-- 이미지 -->
    <div class="object">
        <img src="MALCOM.jpg" alt="제품">
    </div>
    <!-- 버튼 -->
    <button class="cart"> 
        <i class="fa-solid fa-cart-shopping"> </i> 담기
    </button>
    <!-- 제목 -->
    
        <h1 class="subject"> [말콤] 퍼퓸 모이스트필 바디워시 1000ml 2종 (택1) </h1> 

    <!-- 가격 -->
    <div class="price"> 
        <p class="original"> 32,000원 </p> 
        <p > 
        <span class="sale"> 59% </span> 
        <span class="now"> 12,900원 </span>
            </p>
    </div>
    <!-- 리뷰 -->
    <div class="review"> 
        <i class="fa-regular fa-message"> </i> 9,999+
    </div>
</div>

</body>
</html>
