<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Inline_Block </title>
    <style> 
        ul,li{
            list-style: none;
            padding: 0;

        }
        li{
            display: inline-block;
            width: 300px;
            background-color: red;

        }
        /*  */
    </style>
</head>
<body>
    <ul>
        <li>menu 01</li>
        <li>menu 02</li>
        <li>menu 03</li>
        <li>menu 04</li>
        <li>menu 05</li>
    </ul>
</body>
</html>
