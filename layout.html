<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플렉스 연습</title>
    <style> 
        /* 초기화 */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 카테고리 */
        .category{
            width: 80% ;
            margin: 50px auto ; 
            background-color: antiquewhite ; 
            padding: 30px 20px ; 
            display: flex;
            gap: 20px;
            justify-content: center;
        }
/* 아이템 */
.item{
    width: 100px ; 
    /* background-color: red; */
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
}

.item img{

    display: block;
}
.item_img img{
        width: 100%;
    border-radius: 40px;
    overflow: hidden;
}


    </style>
</head>
<body>
    <!-- 카테고리 영역 -->
    <div class="category"> 
        <div class="item"> 
            <!-- 카테고리 아이템 -->

                <!-- 이미지 영역 -->
